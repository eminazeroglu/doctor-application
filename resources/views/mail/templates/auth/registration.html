<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesab Qeydiyyatı</title>
    <style>
        /* Email müştərilərinin dəstəklədiyi əsas CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
            font-size: 16px;
            line-height: 1.4;
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }
        .wrapper {
            width: 100%;
            background-color: #f8f9fa;
            padding: 20px;
            table-layout: fixed;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px;
        }
        .logo {
            max-width: 200px;
            height: auto;
        }
        .title {
            color: #333333;
            font-size: 24px;
            margin-top: 20px;
            font-weight: bold;
        }
        .content {
            color: #666666;
            font-size: 16px;
            line-height: 1.5;
            padding: 20px;
        }
        .button {
            background-color: #007bff;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }
        .footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
        }
        .copyright {
            color: #999999;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <img src="%app_logo%" alt="%app_name%" class="logo">
                <h1 class="title">Xoş gəlmisiniz, %name%!</h1>
            </div>

            <div class="content">
                Hesabınızı təsdiqləmək üçün aşağıdakı düyməyə klik edin.
            </div>

            <div style="text-align: center; padding: 20px;">
    <a href="%confirmation_url%" style="background-color: #007bff;
       color: #ffffff; padding: 12px 24px; border-radius: 4px;
       text-decoration: none; display: inline-block;">
        Hesabı Təsdiqlə
    </a>
</div>
            

            <div class="footer">
                <p class="copyright">
                    © %current_year% %app_name%. Bütün hüquqlar qorunur.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
