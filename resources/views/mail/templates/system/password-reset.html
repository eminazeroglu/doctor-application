<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <title>Şifrə sıfırlama tələbi</title>
    <link rel="stylesheet" href="password-reset.css">
</head>
<body>
    <div class="email-wrapper">
        <div class="email-header">
            <img src="%app_logo%" alt="%app_name%" class="logo">

            <h1>Şifrə sıfırlama tələbi</h1>
        </div>

        <div class="email-content">
            <p>Şifrənizi sıfırlamaq üçün aşağıdakı düyməyə klik edin.</p>
                               <div class="text-center">
                                   <a href="%reset_url%" class="button">Şifrəni Sıfırla</a>
                               </div>
        </div>

        <div class="email-footer">
            <p class="copyright">© %current_year% %app_name%. Bütün hüquqlar qorunur.</p>

            
        </div>
    </div>
</body>
</html>
