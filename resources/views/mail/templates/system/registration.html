<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabınızı təsdiqləyin</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="email-wrapper">
        <div class="email-header">
            <img src="%app_logo%" alt="%app_name%" class="logo">

            <h1>Hesabınızı təsdiqləyin</h1>
        </div>

        <div class="email-content">
            <p>Hesabınızı təsdiqləmək üçün aşağıdakı düyməyə klik edin.</p>
                             <div class="text-center">
                                 <a href="%confirmation_url%" class="button">Hesabı Təsdiqlə</a>
                             </div>
        </div>

        <div class="email-footer">
            <p class="copyright">© %current_year% %app_name%. Bütün hüquqlar qorunur.</p>

            
        </div>
    </div>
</body>
</html>
